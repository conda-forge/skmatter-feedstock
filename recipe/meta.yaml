{% set name = "skmatter" %}
{% set version = "0.4.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1d4e47369bb054aa7d609769dd6dd9609e03ec3a04a1a54393aaabd49fe8cd92

build:
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - scikit-learn >=1.8,<1.9
    - scipy >=1.15

test:
  imports:
    - skmatter
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://github.com/lab-cosmo/scikit-matter
  summary: 'A collection of scikit-learn compatible utilities that implement methods born out of the materials science and chemistry communities'
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://scikit-matter.readthedocs.io

extra:
  recipe-maintainers:
    - PicoCentauri
    - Luthaf
